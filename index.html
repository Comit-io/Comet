<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMET AI | One AI. Infinite Power.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --soft-purple: #bc13fe;
            --bg-dark: #050505;
        }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        
        /* Splash Screen Animation */
        .splash-glow {
            text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--soft-purple);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }

        /* Chat Bubbles */
        .user-bubble {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }
        .comet-bubble {
            background: rgba(188, 19, 254, 0.1);
            border: 1px solid rgba(188, 19, 254, 0.3);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.1);
        }
        
        .mode-btn {
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .mode-btn:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
    </style>
</head>
<body>

    <div id="splash" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-opacity duration-1000">
        <h1 class="text-6xl font-black tracking-tighter splash-glow">COMET</h1>
        <p class="mt-4 text-cyan-400 tracking-[0.3em] text-xs uppercase font-light">One AI. Infinite Power.</p>
        <div class="mt-12 w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div id="app-content" class="h-screen flex flex-col opacity-0 transition-opacity duration-1000">
        <header class="p-4 flex justify-between items-center border-b border-white/10">
            <i class="fa-solid fa-bars text-xl"></i>
            <h2 class="text-xl font-bold tracking-widest text-cyan-400">COMET</h2>
            <i class="fa-solid fa-gear text-xl"></i>
        </header>

        <div class="flex gap-3 p-4 overflow-x-auto no-scrollbar">
            <button class="mode-btn px-6 py-2 rounded-full text-sm flex items-center gap-2 whitespace-nowrap">🧠 Learn</button>
            <button class="mode-btn px-6 py-2 rounded-full text-sm flex items-center gap-2 whitespace-nowrap">👨‍💻 Code</button>
            <button class="mode-btn px-6 py-2 rounded-full text-sm flex items-center gap-2 whitespace-nowrap">🤖 AI</button>
            <button class="mode-btn px-6 py-2 rounded-full text-sm flex items-center gap-2 whitespace-nowrap">🎮 Game</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-6" id="chat-window">
            <div class="comet-bubble p-4 rounded-2xl rounded-tl-none max-w-[85%] animate-fade-in">
                <p class="text-sm leading-relaxed">Hello 👋 I’m COMET. How can I help you today?</p>
            </div>
        </div>

        <div class="p-4 bg-black/50 backdrop-blur-md">
            <div class="flex items-center bg-white/5 border border-white/10 rounded-2xl p-2 pr-4">
                <input type="text" placeholder="Ask anything..." class="bg-transparent flex-1 p-2 outline-none text-sm">
                <button class="text-cyan-400 p-2"><i class="fa-solid fa-microphone"></i></button>
                <button class="bg-cyan-500 text-black w-10 h-10 rounded-xl ml-2 flex items-center justify-center shadow-[0_0_15px_rgba(0,243,255,0.5)]">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Splash Transition Logic
        setTimeout(() => {
            const splash = document.getElementById('splash');
            const content = document.getElementById('app-content');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.classList.add('hidden');
                content.classList.remove('opacity-0');
            }, 1000);
        }, 3000);
    </script>
</body>
</html>
